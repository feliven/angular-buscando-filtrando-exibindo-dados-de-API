<div class="busca-page">
  <app-banner src="assets/imagens/banner-busca.png" alt="" />
  <app-container>
    <app-form-busca (realizarBusca)="busca($event)"></app-form-busca>
    <section class="conteudo">
      <div class="passagens">
        @for (passagemResultadoBusca of listaPassagens; track $index) {
        <app-passagem [passagem]="passagemResultadoBusca"></app-passagem>
        }
      </div>
    </section>
  </app-container>
</div>
